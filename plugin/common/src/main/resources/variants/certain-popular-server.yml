# fork-revision: 1

# NOTE: This file is managed by the plugin. A copy with a lower '# fork-revision' than the bundled one is replaced on startup
# (the old copy is kept next to it as certain-popular-server.yml.rev<N>.<time>.bak.disabled), unless bundled-files.auto-update
# is false in config.yml. Put your own changes into a separate variant file instead of editing this one.
name: certain-popular-server

config:
  use-certain-popular-server-like-holograms-for-spawners: true
  join-random-team-after-lobby: true
  default-shop-file: certain-popular-server/shop.yml
  team-join-item-enabled: false
  add-wool-to-inventory-on-join: false
  use-team-letter-prefixes-before-player-names: true
  use-certain-popular-server-titles: true
  show-game-info-on-start: true
  # modes.only-via-mode-selection is not pinned here, config.yml decides (default false). true = players join these arenas
  # ONLY through mode NPCs / /bw mode join (admins bypass; ignored in bungee mode). Per arena: /bw admin <arena> config set boolean modes.only-via-mode-selection true
  bossbar:
    game:
      enabled: false
    lobby:
      enabled: true
      division: NO_DIVISION
      color: PINK
  sidebar:
    date-format: "MM/dd/yy"
    game:
      enabled: true
      legacy-sidebar: false
      title: "<yellow><bold>BED WARS" # TODO: animated
      team-prefixes:
        target-block-lost: <red>✘
        anchor-empty: <yellow>✘
        target-block-exists: <green>✔
        team-count: <green><count>
      team-line: "<team-color-letter> <team>: <team-status><you>"
      content:
        - "<gray><date>"
        - ""
        - "<tier>"
        - ""
        - "<team-status>"
        - "<additional-content>"
        - ""
        - "<yellow>www.screamingsandals.org"
      additional-content:
        show-if-team-count: "<= 4"
        content:
          - ""
          - "<white>Kills: <green><kills>"
          - "<white>Final Kills: <green><final-kills>"
          - "<white>Bed Broken: <green><target-blocks-destroyed>"
    lobby:
      enabled: true
      title: "<yellow><bold>BED WARS" # TODO: animated
      content:
        - "<gray><date>"
        - ""
        - "<white>Map: <green><game>"
        - "<white>Players: <green><players>/<max-players>"
        - ""
        - "<state>"
        - ""
        - "<white>Mode: <green><mode>"
        - "<white>Version: SBW <gray><version>"
        - ""
        - "<yellow>www.screamingsandals.org"
  game-start-items:
    enabled: true
    items:
      - wooden_sword
      - leather_helmet
      - leather_chestplate
      - leather_leggings
      - leather_boots
  # Hypixel respawn kit: after a death the player gets the wooden sword and the leather armor back. Armor pieces are put into
  # their armor slots (never added to the inventory), and items bought later (permanent items) or keep-armor-on-death
  # are applied after the kit, so no armor is duplicated.
  player-respawn-items:
    enabled: true
    items:
      - wooden_sword
      - leather_helmet
      - leather_chestplate
      - leather_leggings
      - leather_boots
  destroy-placed-blocks-by-explosion:
    enabled: true
    blacklist:
      - glass
  # Bed destruction, sudden death and time limit follow config.yml (defaults: bed-destruction.announce true,
  # sudden-death.dragon.block-destruction placed = only player-placed blocks are broken, game-end-by-time.mode draw).
  # Only values that differ from config.yml are pinned in this block, and a value set here beats config.yml.
  sudden-death:
    dragon:
      speed: 0.8                  # approximate, config.yml default is 0.7
  setup:
    # Hypixel base generators (iron + gold). Pinned on purpose, so this variant keeps them when the global default changes.
    team-generator-types:
      - iron
      - gold
    team-generator-hologram: false        # Hypixel base generators have no hologram
    upgrade-shop-file: certain-popular-server/upgrade-shop.yml


# TODO: breakable blocks (GRASS, LONG_GRASS, SNOW)
# TODO: just add every missing configuration

default-spawner-types-included: false
custom-spawner-types:
  emerald:
    spread: 0.1
    material: emerald
    translate: resource_emerald
    interval: 60
    color: GREEN
    name: Emerald
  diamond:
    spread: 0.1
    material: diamond
    translate: resource_diamond
    interval: 30
    color: BLUE
    name: Diamond
  iron:
    spread: 0.1
    material: iron_ingot
    translate: resource_iron
    interval: 2 # interval is currently still int btw, default value in SBA: 2.5
    color: WHITE
    name: Iron
  gold:
    spread: 0.1
    material: gold_ingot
    translate: resource_gold
    interval: 8
    color: GOLD
    name: Gold

# Team upgrades. Values marked "approx." are approximate Hypixel values and can be changed freely.
upgrades:
  sharpness:
    type: enchantment
    enchantment: minecraft:sharpness
    max-level: 1
    apply-to:
      - "#minecraft:swords"
      - "#minecraft:axes"          # Hypixel's Sharpened Swords also affect axes
  knockback:
    type: enchantment
    enchantment: minecraft:knockback
    max-level: 1
    apply-to:
      - "#minecraft:swords"
  efficiency:                      # kept for custom shops; the bundled upgrade shop sells "haste" instead
    type: enchantment
    enchantment: minecraft:efficiency
    max-level: 2
    apply-to:
      - "#minecraft:pickaxes"
  protection:
    type: enchantment
    enchantment: minecraft:protection
    max-level: 4
    apply-to:
      - "#minecraft:head_armor"
      - "#minecraft:foot_armor"
      - "#minecraft:chest_armor"
      - "#minecraft:leg_armor"
  haste:                           # Maniac Miner
    type: effect
    effect: minecraft:haste
    max-level: 2
    amplifiers: [0, 1]             # level 1 = Haste I, level 2 = Haste II
    duration: -1                   # permanent while in the game
    ambient: true
    particles: false
    icon: true
  forge:                           # Iron / Gold / Emerald / Molten Forge (approx.)
    type: forge
    spawner-types: [iron, gold]
    auto-discover-spawners-if-not-linked: true
    auto-discover-max-distance: 25
    emerald-spawner-type: emerald
    tiers:
      - resource-bonus: 0.5        # I   +50% iron/gold
      - resource-bonus: 1.0        # II  +100%
      - resource-bonus: 1.0        # III base generator also spawns emeralds
        emerald-interval: 60       #     seconds (approx.)
        emerald-amount: 1
      - resource-bonus: 2.0        # IV  +200%
        emerald-interval: 60
        emerald-amount: 1
  dragon-buff:                     # +1 ender dragon for the team in sudden death
    type: dragon-buff
    max-level: 1
    extra-dragons-per-level: 1
  healpool:                        # permanent base area effect (not a queued trap)
    type: area-effect
    name: Healpool
    detection-range: 7
    effects:                       # keep amplifier 1 + duration 30: refreshed every second (Regeneration I would never tick with this duration)
      - effect: minecraft:regeneration
        duration: 30
        amplifier: 1
    enemies: false
    team: true
    singular-use: false
  # The former "blindtrap"/"minertrap" (blindtrap gave REGENERATION to intruders) are replaced by the trap queue below.

# Hypixel-like trap queue (approx.): up to 3 traps, cost 1/2/4 diamonds, first queued trap fires when an enemy enters the base.
trap-queue:
  enabled: true
  max-size: 3
  currency: diamond
  costs: [1, 2, 4]
  cooldown-seconds: 15             # approx. / UNCERTAIN
  detection-range: 10              # approx.
  allow-duplicates: true
  traps:
    its-a-trap:
      name: "@fork.in_game.traps.names.its_a_trap"
      icon: tripwire_hook
      enemy-effects:
        - effect: minecraft:blindness
          duration: 160            # 8 s (approx.)
          amplifier: 0
        - effect: minecraft:slowness
          duration: 160
          amplifier: 0
    counter-offensive:
      name: "@fork.in_game.traps.names.counter_offensive"
      icon: feather
      team-effect-range: 20
      team-effects:
        - effect: minecraft:speed
          duration: 300            # 15 s (approx.)
          amplifier: 1
        - effect: minecraft:jump_boost
          duration: 300
          amplifier: 1
    alarm:
      name: "@fork.in_game.traps.names.alarm"
      icon: redstone_torch
      reveal-invisible: true
      affect-all-intruders: true
    miner-fatigue:
      name: "@fork.in_game.traps.names.miner_fatigue"
      icon: iron_pickaxe
      enemy-effects:
        - effect: minecraft:mining_fatigue
          duration: 200            # 10 s (approx.)
          amplifier: 0

# Game timeline: generator tiers, bed destruction, sudden death, game end.
# Times = elapsed RUNNING time ("m:ss"). All values are APPROXIMATE Hypixel values and can be changed freely.
timeline:
  enabled: true
  announcements:
    chat: true
    title: true      # Hypixel itself only uses chat for generator upgrades; set false for that behaviour
    sound:
      name: block.note_block.pling
      source: master
      volume: 1
      pitch: 1
  spawner-tiers:
    diamond:
      1: 30 seconds
      2: 23 seconds
      3: 12 seconds
    emerald:
      1: 65 seconds   # custom-spawner-types.emerald.interval (60) is still used when the timeline is disabled
      2: 50 seconds
      3: 35 seconds
  events:
    - id: diamond-2
      time: "6:00"
      type: spawner-tier
      spawner: diamond
      tier: 2
    - id: emerald-2
      time: "12:00"
      type: spawner-tier
      spawner: emerald
      tier: 2
    - id: diamond-3
      time: "18:00"
      type: spawner-tier
      spawner: diamond
      tier: 3
    - id: emerald-3
      time: "24:00"
      type: spawner-tier
      spawner: emerald
      tier: 3
    - id: bed-destruction
      time: "30:00"
      type: bed-destruction
    - id: sudden-death
      time: "40:00"
      type: sudden-death
    - id: game-end
      time: "50:00"
      type: game-end

prefabs:
  # Usage: /bw admin <arena> prefab upgrade-shop
  upgrade-shop:
    type: command
    commands:
      - /bw admin %game% store add
      - /bw admin %game% store file set certain-popular-server/upgrade-shop.yml